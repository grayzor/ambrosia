# Every pull request: the tests, a release build and the update smoke test
# (an older installed version must update itself to this one). Required to merge
# into main (branch protection).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: node scripts/build.js --out dist
      - name: Update smoke test
        run: node scripts/smoke-update.js dist
