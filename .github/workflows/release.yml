# Every merge into main publishes a release Ambrosia updates itself from
# (src/main/updater.js): latest.json + the full zip + the application zip.
# Version: <major>.<minor> of package.json + the commit count of main (scripts/build.js).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        id: build
        run: node scripts/build.js --out dist
      - name: Update smoke test
        run: node scripts/smoke-update.js dist
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION existe déjà : rien à publier."
            exit 0
          fi
          gh release create "v$VERSION" \
            dist/latest.json dist/Ambrosia-*.zip dist/install.ps1 \
            --target "$GITHUB_SHA" \
            --title "Ambrosia $VERSION" \
            --generate-notes \
            --latest
